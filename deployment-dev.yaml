apiVersion: apps/v1
kind: Deployment
metadata:
  name: sanwuya-lab3-2-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sanwuya-lab3-2
  template:
    metadata:
      labels:
        app: sanwuya-lab3-2
    spec:
      containers:
      - name: nginx
        image: cithit/sanwuya:latest
        ports:
        - containerPort: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sanwuya-lab3-2-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - http:
      paths:
      - path: /lab3-2
        pathType: Prefix
        backend:
          service:
            name: sanwuya-lab3-2-service
            port:
              number: 80

---
apiVersion: v1
kind: Service
metadata:
  name: sanwuya-lab3-2-service
spec:
  type: ClusterIP
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  selector:
    app: sanwuya-lab3-2